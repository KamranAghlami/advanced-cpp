name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Note: every job clones EnTT and Taskflow through FetchContent. There is no
# actions/cache step for third_party/ because CMake's git download step wipes the
# source directory whenever its stamp file is missing, so caching the sources
# without also caching build/_deps buys nothing.

jobs:
  build:
    name: ${{ matrix.compiler.name }} / C++${{ matrix.std }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # C++20 is the floor both libraries declare; 23 is what this project
        # builds at by default. Exercise code has to keep working at 20,
        # otherwise we have learned a C++23 answer to a C++20 problem.
        std: [20, 23]
        compiler:
          - { name: gcc, cc: gcc, cxx: g++, apt: g++ }
          - { name: clang, cc: clang, cxx: clang++, apt: clang }
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.compiler.apt }}

      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The layout probes' output IS the deliverable -- this repo's rule is
      # measure-don't-assert, and cross-toolchain size comparison is the whole
      # reason the msvc and macOS legs exist. `--output-on-failure` shows a
      # test's notes only when it fails, which means the numbers went missing at
      # exactly the moment they were confirmed. Re-run the layout probes verbosely
      # so every run records the sizes it measured, on the record, per toolchain.
      - name: Record layout measurements
        run: ctest --test-dir build -V -R "compressed_pair_layout|layout_assertions|node_layout"

  # ---------------------------------------------------------------------------
  # MSVC. A third toolchain and, more usefully, a third standard library and a
  # third object format -- the same axis the M1 opened up, pointed at Windows.
  #
  # It is what finally answers Module 3's open question: MSVC's ABI ignores
  # [[no_unique_address]] and needs [[msvc::no_unique_address]] to compress at
  # all, which is exactly why EnTT still ships the inheritance-based
  # compressed_pair. That has been documented-from-the-manual in
  # modules/03-layout-economy/NOTES.md and never measured. Now it will be.
  #
  # Twenty tests do not run here, and none of them for a reason to do with this
  # code: sixteen codegen assertions are x86-64 AT&T patterns, two negative
  # compilation tests drive the compiler with GNU flags, one reads `nm`, and one
  # bisects -ftemplate-depth. Module 1's cross-DSO test is skipped separately,
  # because Windows has no weak-symbol coalescing for it to be about at all --
  # see that module's NOTES.md.
  #
  # Release, not Debug: this is a multi-config generator, and the benchmark
  # targets' optimisation flag is empty on MSVC precisely so the configuration
  # can carry it (a Debug /O2 collides with /RTC1).
  msvc:
    name: msvc / C++${{ matrix.std }}
    runs-on: windows-2022
    # Blocking as of 2026-08-26, one working day after it was added and the moment
    # it first went green -- the same promise the TSan leg was held to before
    # Module 9. A job that is permanently allowed to fail is a job nobody reads.
    #
    # It earned it: on its first two runs it caught an unjustified assertion in
    # Module 3 (a *may* in the standard asserted as a *must*, green on two
    # toolchains that happened to take the option) and one false claim in library
    # code (Module 12's "the default closure costs nothing", which costs a word
    # here). Both are in those modules' NOTES.md.
    strategy:
      fail-fast: false
      matrix:
        std: [20, 23]
    steps:
      - uses: actions/checkout@v4

      # The Visual Studio generator rather than Ninja: it needs no developer
      # command prompt and no third-party action to set one up.
      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -LE measurement

      # The layout probes' output IS the deliverable -- this repo's rule is
      # measure-don't-assert, and cross-toolchain size comparison is the whole
      # reason the msvc and macOS legs exist. `--output-on-failure` shows a
      # test's notes only when it fails, which means the numbers went missing at
      # exactly the moment they were confirmed. Re-run the layout probes verbosely
      # so every run records the sizes it measured, on the record, per toolchain.
      - name: Record layout measurements
        run: ctest --test-dir build -C Release -V -R "compressed_pair_layout|layout_assertions|node_layout"

  sanitizers:
    name: sanitizer / ${{ matrix.san.name }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.san.informational }}
    strategy:
      fail-fast: false
      matrix:
        san:
          - name: asan-ubsan
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer -g
            informational: false
          # Blocking as of Module 9: src/acpp/wsq.hpp is our own lock-free code,
          # so a TSan report here is about us. Phase C's ground rule is that
          # nothing concurrent is believed until it is TSan-clean, and leaving
          # this informational would quietly defeat it.
          - name: tsan
            flags: -fsanitize=thread -fno-omit-frame-pointer -g
            informational: false
    steps:
      - uses: actions/checkout@v4

      # clang deliberately, not gcc: GCC's TSan does not model
      # atomic_thread_fence (it warns -Wtsan and ignores it), and that fence is
      # the entire correctness argument in Modules 9 and 10. See docs/CLAUDE.md.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="${{ matrix.san.flags }}"

      - name: Build
        run: cmake --build build -j

      # The sanitizer runtimes abort with "unexpected memory mapping" when the
      # kernel hands out more ASLR entropy than they can map around.
      - name: Lower ASLR entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      # -LE measurement: the template-instantiation-depth probe compiles the same
      # TU dozens of times to bisect a bound. It is a measurement, not a
      # pass/fail signal, and it is minutes of work under a sanitizer.
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure -LE measurement
